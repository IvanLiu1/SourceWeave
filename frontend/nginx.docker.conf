# 容器内 nginx 配置：静态资源 + API/WebSocket 反向代理
log_format websocket_redacted '$remote_addr - $remote_user [$time_local] '
                                '"$request_method /proxy-ws/chat/{redacted} $server_protocol" '
                                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  server_name _;

  # 与后端 multipart 上限保持一致（max-request-size: 100MB）
  client_max_body_size 100m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1k;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # REST API
  location /api/ {
    proxy_pass http://backend:8081;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  # WebSocket（前端固定使用 /proxy-ws 前缀，转发时去掉）
  location /proxy-ws/ {
    # WebSocket ticket 是认证凭证；保留访问元数据，但绝不记录原始 URI。
    access_log /var/log/nginx/access.log websocket_redacted;
    rewrite ^/proxy-ws(/.*)$ $1 break;

    proxy_pass http://backend:8081;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 聊天长连接：避免空闲被过早断开（前端心跳间隔 20s）
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }
}
