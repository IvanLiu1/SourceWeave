name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 测试自包含:H2 内存库 + fail-soft 启动自检,无需 MySQL/ES/Kafka/MinIO/Redis
      - name: Run backend tests
        run: mvn -B -ntp test

  frontend:
    name: frontend-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # 跳过 prepare 里的 simple-git-hooks:CI runner 不需要安装 git 钩子
      SKIP_SIMPLE_GIT_HOOKS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
