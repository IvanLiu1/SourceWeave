name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 测试自包含:H2 内存库 + fail-soft 启动自检,无需 MySQL/ES/Kafka/MinIO/Redis
      - name: Verify backend
        run: mvn -B -ntp verify

  frontend:
    name: frontend-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # 跳过 prepare 里的 simple-git-hooks:CI runner 不需要安装 git 钩子
      SKIP_SIMPLE_GIT_HOOKS: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先 build:auto-imports.d.ts / components.d.ts 是 vite 插件生成物且被 gitignore,
      # 全新 checkout 里不存在,typecheck 必须在 build 生成它们之后跑
      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm typecheck

  rag-evaluation-tools:
    name: rag-evaluation-tools-offline-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 仅验证本地数据准备、结果合并和评分逻辑；不生成回答，也不调用任何模型 API。
      - name: Run offline RAG evaluation tool tests
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v

  deployment-config:
    name: deployment-config-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 示例文件故意留空生产密钥；这里只注入非生产占位值来验证 Compose 插值和结构。
      - name: Validate Docker Compose configuration
        env:
          JWT_SECRET_KEY: Y2ktb25seS1ub24tcHJvZHVjdGlvbi1kdW1teS1rZXktMzI=
        run: docker compose --env-file .env.docker.example config --quiet
