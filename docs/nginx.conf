# 以下为前端编译发布后nginx配置的相关代码片段
log_format websocket_redacted '$remote_addr - $remote_user [$time_local] '
                                '"$request_method /proxy-ws/chat/{redacted} $server_protocol" '
                                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 8080;

  location / {
    # root D:/ragproject/frontend/dist;
    root html;
    index index.html index.htm;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8081;
  }

  location /proxy-ws {
    # WebSocket URI 含一次性票据，访问日志只保留脱敏后的路由模板。
    access_log /var/log/nginx/access.log websocket_redacted;
    rewrite ^/proxy-ws(/.*)$ $1 break;

    proxy_pass http://127.0.0.1:8081;

    # 必须设置以下头部以支持 WebSocket
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
